name: Profile art

# Regenerates the contribution bloom animation and activity graph
# from real contribution data, once a day and on demand.
on:
  schedule:
    - cron: "0 16 * * *" # every day at 00:00 Philippine time
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/profile-art.mjs"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs
        run: node .github/scripts/profile-art.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile art" && git push)
